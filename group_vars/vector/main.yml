---
vector_version: "0.33.0"
vector_arch: "x86_64-unknown-linux-gnu"
vector_install_dir: "/opt/vector"
vector_config_dir: "/etc/vector"
vector_data_dir: "/var/lib/vector"
vector_config_file: "{{ vector_config_dir }}/vector.toml"



vector_download_protocol: "https"
vector_download_domain: "github.com"
vector_repo_owner: "vectordotdev"
vector_repo_name: "vector"
vector_release_type: "releases/download"
vector_archive_url: "{{ vector_download_protocol }}://{{ vector_download_domain }}/{{ vector_repo_owner }}/{{ vector_repo_name }}/{{ vector_release_type }}/v{{ vector_version }}/vector-{{ vector_version }}-{{ vector_arch }}.tar.gz"
